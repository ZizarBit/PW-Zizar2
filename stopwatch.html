<!DOCTYPE html>
<!-- Provided HTML for Stopwatch Example -->
<html lang='en'>
  <head>
    <meta charset='utf-8'>
    <script src='stopwatch.js'></script>
    <title>Cronometro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stopwatch.css">
  </head>
  <body>
    <section>
      <article>
        <time id="timer">0 segundos</time>
        <div>
          <button id='stopwatch'>Iniciar/Pausar Cronometro</button>
          <button id='reset'>Reiniciar Cronometro</button>
        </div>
      </article>
    </section>
  </body>
</html>
