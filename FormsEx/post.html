<!DOCTYPE html>
<html lang='en' dir='ltr'>
  <head>
    <meta charset='utf-8'>
    <title>Post</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='post.css'>
    <script src='post.js'></script>
  </head>
  <body>
    <p id='error' class="hidden">
      An error occurred- please try again!
    </p>
    <section id="login-form">
      <h1>Log In</h1>
      <form>
        <label>Username <input id='username' name="user" type='text' required></label>
        <label>Password <input id='password' name="password" type='password' required></label>
        <button id='sign-in'>Sign In</button>
      </form>
    </section>
    <section id="secured-section" class="hidden">
      <h1>Congrats!  You have successfully logged in!</h1>
      <p>This is a different page that you can only see if you've logged in!</p>
    </section>
  </body>
</html>
